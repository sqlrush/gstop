# gsbench lightweight scenario release (65 implemented / 25 deferred)
# Author: WangYingJie <sqlrush@gmail.com>

[database]
host = 127.0.0.1
port = 5433
database = postgres
user = gaussdb
password_env = GSBENCH_PASSWORD
# 可选：填写同一发布目录内的 gstop.cfg，以复用其中的 main.db_password。
# password_config = gstop.cfg
sslmode = disable
application_name = gsbench
connect_timeout = 5s

[topology]
# 产品、拓扑和节点由 doctor/运行前只读探测。
# 当前 BenchConfig 没有手工覆盖拓扑的配置项，本节故意不设置键。

[run]
# Keep the shipped default to one Risk-A scenario. Select additional registered
# scenarios at the CLI or by replacing this code after running doctor.
scenarios = 101
# 压测总时长，包含 ramp 升压和 hold 稳态阶段。
duration = 10m
ramp_interval = 2s
profile = quick
dry_run = false
# 运行时验证总开关。测试环境默认关闭；需要严格校验时改为 true。
validation_enabled = false

[data]
schema = gsbench
max_size_gb = 5
min_free_disk_percent = 20
reuse_existing = true
# auto: loopback/unix endpoints use the exact server data_directory; remote
# centralized endpoints require a finite pg_tablespace.spcmaxsize quota.
# Distributed capacity initialization is unavailable in this build until
# verified per-primary-DN provider wiring is implemented.
capacity_provider = auto
# Optional host prefix for a local database running in a chroot. For example,
# server /var/lib/engine/data1 plus /var/chroot resolves to the host path
# /var/chroot/var/lib/engine/data1. Empty keeps the exact server path.
data_directory_host_root =
# auto/catalog uses documented object-size functions only for centralized
# targets. Distributed physical sizing requires provider wiring not present
# in this build.
physical_size_provider = auto

[safety]
cpu_target_percent = 95
max_connections = 800
max_workers = 640
query_timeout = 30s
restore_timeout = 10m
profile_cap_gb = 256
# Risk B/C 默认关闭；还必须在命令行显式传 --allow-risk 才能授权。
allow_admin_mutation = false
allow_infrastructure_fault = false
restore_original_role = false
allow_instance_parameter_change = false
allow_database_restart = false
restart_command =

[fault_provider]
# 本版本仅内置 fail-closed 的 none；外部故障适配器必须由已验证实现显式注册。
type = none
# ledger_path 留空时，使用 logs 下按配置文件身份隔离的恢复 JSON 文件。
# ledger_path =

[scenario.ap_cpu]
cpu_target_percent = 70
max_workers = 8
scan_rows = 1000000

[scenario.mixed_cpu]
cpu_target_percent = 70
tp_percent = 80
max_workers = 20
max_ap_workers = 4
scan_rows = 1000000

[scenario.connection_pool]
target_percent = 95
idle_percent = 60
idle_in_transaction_percent = 20

[scenario.thread_pool]
target_percent = 95

[scenario.vacuum_pressure]
mode = vacuum
allow_vacuum_full = false
minimum_slowdown = 1.5
